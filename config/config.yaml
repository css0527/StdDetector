# 敌方颜色
enemy_color: "red"
# enemy_color: "blue"

# ROI区域
use_roi: false
roi:
  x: 420
  y: 50
  width: 600
  height: 600

# 传统方法参数 - 放宽以便检测
threshold: 100                     # 降低二值化阈值
max_angle_error: 60                # 放宽角度
min_lightbar_ratio: 1.0
max_lightbar_ratio: 30.0
min_armor_ratio: 0.5
max_armor_ratio: 8.0
max_rectangular_error: 40
min_confidence: 0.5 


# 相机参数
camera_name: "hikrobot"
exposure_ms: 2
gain: 16
vid_pid: "MV-CS016-10UC"
# 重投影误差: 0.1143px
camera_matrix: [1805.5840363296295, 0, 710.34226967429754, 0, 1805.674155969999, 553.14802224830373, 0, 0, 1]
distort_coeffs: [-0.075632678207842807, 0.085774463005285684, -0.00032576760334061751, 0.00010117163734014234, 0]

# 相机同理想情况的偏角: yaw0.46 pitch0.61 roll-1.53 degree
R_camera2gimbal: [-0.0083195760046954614, 0.010498791137270739, 0.99991027599468041, -0.99960756138647755, -0.026835747568381807, -0.0080352891314148939, 0.026748978935305992, -0.99958472279097077, 0.010717933047771133]
t_camera2gimbal: [0.094969301833534511, 0.095006290298006682, 0.050987066291756609]

# 装甲板物理尺寸 (单位:米)
armor_width: 0.135
lightbar_length: 0.056

# ----- 卡尔曼滤波参数 -----
kalman_filter:
  Q_pos: 0.5
  Q_vel: 0.5
  R_meas: 0.05

# ===== 串口配置 =====
serial_port: "/dev/ttyUSB0"  # 串口设备路径
baudrate: 115200             # 波特率

# 串口协议参数
serial_protocol:
  # 发送协议
  tx_header: 0xED            # 发送帧头
  tx_cmd_id: 0x01            # 发送指令ID
  tx_data_length: 0x04       # 发送数据长度
  tx_frame_length: 8         # 发送帧长度
  
  # 接收协议
  rx_header: 0x78            # 接收帧头
  rx_footer: 0x76            # 接收帧尾
  rx_frame_length: 14        # 接收帧长度
  
  # 功能码
  tx_ctrl_id: 0x02           # 控制指令ID
  tx_shoot_id: 0x03          # 射击指令ID

# 通讯延迟
communication:
  default_delay_ms: 5.0
  enable_compensation: true

# ----- 视频/相机切换 -----
video:
  use_camera: true
  video_path: "/home/scurm/StdDetector/video/8radps.avi"
  camera_index: 0
